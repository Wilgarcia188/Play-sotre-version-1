name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the obsolete "tools"
          # package, which Google removed from the SDK repository; installing
          # it now fails the whole job.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-suite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Los artefactos de Actions solo se bajan estando logueado y vienen en .zip,
      # que Android no puede instalar. Una release da un enlace directo al .apk.
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk pdf-suite-debug.apk
          gh release create "debug-${{ github.run_number }}" pdf-suite-debug.apk \
            --title "PDF Suite debug #${{ github.run_number }}" \
            --notes "Build de ${{ github.ref_name }} (${{ github.sha }})" \
            --prerelease
